<!doctype html>
<html lang="nl">
<head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Formulierdefinitie</title></head>
<body>
  <!-- Netlify detects this static definition at deploy time. Keep field names
       aligned with the interactive form in app/components/PriceFunnel.tsx. -->
  <form name="offerte-aanvraag" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="offerte-aanvraag">
    <input type="text" name="firstName">
    <input type="text" name="lastName">
    <input type="text" name="postalCode">
    <input type="email" name="email">
    <input type="text" name="phone">
    <input type="text" name="message">
    <input type="text" name="location">
    <input type="text" name="product">
    <input type="text" name="subfloor">
    <input type="text" name="area">
    <input type="text" name="timing">
    <input type="text" name="estimate">
    <input type="text" name="contactConsent">
    <input type="text" name="privacyConsent">
    <input type="text" name="bot-field">
  </form>
</body>
</html>
